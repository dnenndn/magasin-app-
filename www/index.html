  // ---- NFC tags --------------------------------------------------------
  // A tag only carries its UID; the article it stands for is stored on the
  // server (/nfc). The native side is the small NfcUid plugin (MainActivity).
  function nfcPlugin() {
    if (!window.Capacitor?.isNativePlatform?.()) return null;
    return window.Capacitor.Plugins?.NfcUid || window.Capacitor.registerPlugin?.('NfcUid') || null;
  }

  // Opens a full-screen "hold the phone against the tag" sheet. Calls
  // onUid(uid) for every tag read until the person taps the close button.
  // onUid may return a short status string that is shown under the prompt.
  async function openNfcScanner({ title, hint, onUid }) {
    const nfc = nfcPlugin();
    if (!nfc) { showToast('Le NFC n\'est disponible que dans l\'application Android.', true); return; }
    try {
      await nfc.start();
    } catch (e) {
      const m = String(e?.message || e);
      showToast(m.includes('DISABLED') ? 'Activez le NFC dans les réglages du téléphone.'
        : m.includes('NOT_SUPPORTED') ? 'Ce téléphone n\'a pas de NFC.' : 'NFC indisponible : ' + m, true);
      return;
    }
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:flex-end';
    overlay.innerHTML = `
      <div style="background:var(--panel);width:100%;border-radius:16px 16px 0 0;padding:20px;padding-bottom:calc(20px + var(--safe-bottom));text-align:center">
        <div style="font-size:2.6rem">📡</div>
        <h2 style="margin:6px 0">${escapeHtml(title)}</h2>
        <div class="muted">${escapeHtml(hint || 'Approchez le téléphone du tag.')}</div>
        <div id="nfc-status" style="margin:14px 0;min-height:2.6em;font-weight:600"></div>
        <button class="primary" id="nfc-close">Terminer</button>
      </div>`;
    document.body.appendChild(overlay);
    const status = overlay.querySelector('#nfc-status');
    let closed = false, busy = false, last = '', lastAt = 0;
    const handle = await nfc.addListener('tag', async (ev) => {
      if (closed || !ev?.uid) return;
      // The same tag is reported repeatedly while it stays in range: ignore
      // the same UID for 1.5 s, and ignore reads while one is being handled.
      const now = Date.now();
      if (busy || (ev.uid === last && now - lastAt < 1500)) return;
      busy = true; last = ev.uid; lastAt = now;
      try {
        status.className = '';
        status.textContent = (await onUid(ev.uid)) || '✓ Tag lu';
      } catch (e) {
        status.className = 'error';
        status.textContent = e.message;
      } finally {
        busy = false;
        lastAt = Date.now();
      }
    });
    const close = () => {
      if (closed) return;
      closed = true;
      try { handle.remove(); } catch (e) {}
      nfc.stop().catch(() => {});
      overlay.remove();
    };
    overlay.querySelector('#nfc-close').onclick = close;
    return close;
  }

  function resolveNfcTag(uid) {
    return api('/nfc/resolve?uid=' + encodeURIComponent(uid));
  }

  // BSM: each scan adds the article, or +1 if it's already in the list.
  function scanIntoBsm() {
    openNfcScanner({
      title: 'Scanner les articles',
      hint: 'Un passage = +1. Passez le même tag plusieurs fois pour augmenter la quantité.',
      onUid: async (uid) => {
        const { article } = await resolveNfcTag(uid);
        const existing = state.bsmLines.find((l) => l.id === article.id);
        if (existing) existing.qty = (Number(existing.qty) || 0) + 1;
        else state.bsmLines.push({ id: article.id, name: article.designation, qty: 1 });
        renderLines('lines', state.bsmLines);
        const l = state.bsmLines.find((x) => x.id === article.id);
        return `✓ ${article.designation} × ${l.qty}`;
      }
    });
  }

  // BRM: the first scan clears the quantities (all lines start at "return
  // everything"), then each scan adds 1 to the scanned article, capped at
  // what was issued. An article that isn't in this BSM is refused.
  function scanIntoBrm(idBsm, detail) {
    let fresh = true;
    openNfcScanner({
      title: 'Scanner les articles à retourner',
      hint: 'Un passage = +1 (maximum : la quantité sortie).',
      onUid: async (uid) => {
        const { article } = await resolveNfcTag(uid);
        const line = state.brmReturnLines.find((l) => l.id_article === article.id);
        if (!line) throw new Error(`« ${article.designation} » n'est pas dans ce BSM.`);
        if (fresh) { state.brmReturnLines.forEach((l) => { l.qty = 0; }); fresh = false; }
        if (line.qty >= line.max) throw new Error(`« ${article.designation} » : déjà ${line.max} / ${line.max}.`);
        line.qty = Math.min(line.max, (Number(line.qty) || 0) + 1);
        renderBrmReturnLines(idBsm, detail);
        return `✓ ${article.designation} × ${line.qty} / ${line.max}`;
      }
    });
  }

  // Managers: list / add / remove the tags attached to one article.
  async function openArticleTags(idArticle, designation) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;display:flex;align-items:flex-end';
    overlay.innerHTML = `
      <div style="background:var(--panel);width:100%;max-height:75vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + var(--safe-bottom))">
        <h2 style="margin-top:0">Tags NFC</h2>
        <div class="muted" style="margin-bottom:10px">${escapeHtml(designation)}</div>
        <div id="tags-list"><div class="empty">Chargement…</div></div>
        <button class="primary" id="tags-add">📡 Associer un tag</button>
        <button class="ghost" id="tags-close" style="width:100%;margin-top:8px">Fermer</button>
      </div>`;
    document.body.appendChild(overlay);
    const list = overlay.querySelector('#tags-list');
    async function refresh() {
      try {
        const tags = await api('/nfc/article/' + idArticle);
        list.innerHTML = tags.length === 0 ? '<div class="empty">Aucun tag associé</div>' : tags.map((t) => `
          <div class="line-item">
            <div class="line-name">${escapeHtml(t.uid)}</div>
            <button class="ghost" data-uid="${escapeHtml(t.uid)}">✕</button>
          </div>`).join('');
        list.querySelectorAll('button[data-uid]').forEach((b) => {
          b.onclick = async () => {
            if (!confirm('Retirer ce tag de l\'article ?')) return;
            try { await api('/nfc/tags/' + encodeURIComponent(b.dataset.uid), { method: 'DELETE' }); refresh(); }
            catch (e) { showToast(e.message, true); }
          };
        });
      } catch (e) {
        list.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      }
    }
    overlay.querySelector('#tags-close').onclick = () => overlay.remove();
    overlay.querySelector('#tags-add').onclick = async () => {
      let closeScanner;
      closeScanner = await openNfcScanner({
        title: 'Associer un tag',
        hint: `Approchez le tag à associer à « ${designation} ».`,
        onUid: async (uid) => {
          try {
            await api('/nfc/tags', { method: 'POST', body: { uid, id_article: idArticle } });
          } catch (e) {
            // Tag already attached to another article: ask before moving it.
            if (!/déjà associé/.test(e.message) || !confirm(e.message + '\n\nLe réassigner à cet article ?')) throw e;
            await api('/nfc/tags', { method: 'POST', body: { uid, id_article: idArticle, replace: true } });
          }
          refresh();
          if (closeScanner) closeScanner();
          showToast('✓ Tag associé');
          return '✓ Tag associé';
        }
      });
    };
    refresh();
  }

  // ---- Shared widgets -----------------------------------------------
  let toastTimer = null;
  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    const bubble = toast.querySelector('.bubble');
    bubble.textContent = message;
    bubble.classList.toggle('error', isError);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  async function loadSelect(id, path, labelField, valueField = 'id') {
    const el = document.getElementById(id);
    try {
      const rows = await api(path);
      el.innerHTML = rows.map((r) => `<option value="${r[valueField]}">${escapeHtml(r[labelField])}</option>`).join('');
    } catch (e) {
      el.innerHTML = `<option>Erreur de chargement</option>`;
    }
  }

  function wireTypeSegmented(containerId) {
    const container = document.getElementById(containerId);
    container.querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        container.querySelectorAll('button').forEach((x) => x.classList.remove('selected'));
        b.classList.add('selected');
      };
    });
  }

  function wireArticlePicker(inputId, suggestionsId, onPick) {
    const input = document.getElementById(inputId);
    const box = document.getElementById(suggestionsId);
    let inflight = null;
    input.oninput = debounce(async () => {
      const q = input.value.trim();
      if (inflight) inflight.abort();          // a newer search replaces the old one
      if (q.length < 2) { box.innerHTML = q ? '<div class="muted">Tapez au moins 2 lettres…</div>' : ''; return; }
      inflight = new AbortController();
      try {
        const rows = await api('/articles?limit=8&search=' + encodeURIComponent(q), { signal: inflight.signal });
        box.innerHTML = rows.slice(0, 8).map((a) => `
          <div class="article-row" data-id="${a.id}" data-name="${escapeHtml(a.designation)}" style="cursor:pointer">
            <div class="name">${escapeHtml(a.designation)}</div>
            <span class="stock-pill">${(a.stock_neuf || 0) + (a.stock_use || 0)}</span>
          </div>
        `).join('');
        box.querySelectorAll('.article-row').forEach((row) => {
          row.onclick = () => {
            onPick({ id: Number(row.dataset.id), name: row.dataset.name });
            input.value = ''; box.innerHTML = '';
          };
        });
      } catch (e) {
        if (e.cancelled) return;
        box.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      }
    }, 400);
  }

  function addLine(list, article, containerId) {
    if (list.some((l) => l.id === article.id)) return;
    list.push({ id: article.id, name: article.name, qty: 1 });
    renderLines(containerId || 'lines', list);
  }

  function renderLines(containerId, list) {
    const box = document.getElementById(containerId);
    if (!box) return;
    if (list.length === 0) {
      box.innerHTML = '<div class="empty">Aucun article ajouté</div>';
      return;
    }
    box.innerHTML = list.map((l, i) => `
      <div class="line-item">
        <div class="line-name">${escapeHtml(l.name)}</div>
        <input type="number" min="0.01" step="0.01" value="${l.qty}" data-idx="${i}" class="line-qty" />
        <button class="ghost" data-idx="${i}" data-action="remove">✕</button>
      </div>
    `).join('');
    box.querySelectorAll('.line-qty').forEach((inp) => {
      inp.oninput = () => { list[Number(inp.dataset.idx)].qty = Number(inp.value); };
    });
    box.querySelectorAll('[data-action=remove]').forEach((btn) => {
      btn.onclick = () => { list.splice(Number(btn.dataset.idx), 1); renderLines(containerId, list); };
    });
  }

  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // ---- Install prompt (Android/Chrome native prompt + iOS instructions) --
  function setupInstallBanner() {
    const banner = document.getElementById('install-banner');
    const text = document.getElementById('install-banner-text');
    const action = document.getElementById('install-banner-action');
    const close = document.getElementById('install-banner-close');

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (isStandalone) return; // already installed, nothing to do

    if (localStorage.getItem('gmao_install_dismissed') === '1') return;

    close.onclick = () => {
      banner.classList.remove('show');
      localStorage.setItem('gmao_install_dismissed', '1');
    };

    const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);

    if (isIos) {
      text.textContent = 'Installez cette app : appuyez sur Partager puis "Sur l\'écran d\'accueil".';
      action.style.display = 'none';
      banner.classList.add('show');
      return;
    }

    // Android/Chrome: wait for the browser's own install signal, then
    // trigger its native prompt from our button.
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      text.textContent = 'Installez Stock GMAO sur cet appareil.';
      action.textContent = 'Installer';
      action.style.display = 'inline-block';
      banner.classList.add('show');
    });

    action.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.classList.remove('show');
    };
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW registration failed', e));
    });
  }

  setupInstallBanner();
  loadTheme();
  loadSession();
  render();
  if (state.token) registerPushNotifications();

  // Keep the branded loading screen up just long enough to be seen (avoids
  // an ugly flash on fast devices/local networks), then fade it out.
  const MIN_SPLASH_MS = 900;
  setTimeout(() => {
    const el = document.getElementById('loading-screen');
    if (el) {
      el.classList.add('hidden');
      setTimeout(() => el.remove(), 450);
    }
  }, MIN_SPLASH_MS);
})();
</script>
</body>
