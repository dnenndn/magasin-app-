<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stock GMAO</title>

<!-- Android / Chrome install -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16211c" />

<!-- iOS / Safari install (Safari ignores the manifest for these bits) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stock GMAO" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />

<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<style>
  :root {
    --ink: #221f1c;
    --paper: #f7f5f2;
    --panel: #ffffff;
    --panel-2: #f1ede8;
    --line: #e7e1da;
    --accent: #b8451f;
    --accent-ink: #ffffff;
    --success: #2f8f57;
    --success-ink: #ffffff;
    --warn: #b8721f;
    --warn-bg: rgba(184, 114, 31, 0.10);
    --warn-border: rgba(184, 114, 31, 0.35);
    --warn-icon-bg: rgba(184, 114, 31, 0.20);
    --danger: #b83f36;
    --danger-ink: #ffffff;
    --muted: #746b64;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f2f0ed;
      --paper: #0e0e10;
      --panel: #1a1a1d;
      --panel-2: #222225;
      --line: #2b2a2c;
      --accent: #d1592f;
      --accent-ink: #fff7f2;
      --success: #3fae6a;
      --success-ink: #08170f;
      --warn: #e0a458;
      --warn-bg: rgba(224, 164, 88, 0.14);
      --warn-border: rgba(224, 164, 88, 0.40);
      --warn-icon-bg: rgba(224, 164, 88, 0.24);
      --danger: #dd6259;
      --danger-ink: #200604;
      --muted: #9b9691;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f2f0ed;
    --paper: #0e0e10;
    --panel: #1a1a1d;
    --panel-2: #222225;
    --line: #2b2a2c;
    --accent: #d1592f;
    --accent-ink: #fff7f2;
    --success: #3fae6a;
    --success-ink: #08170f;
    --warn: #e0a458;
    --warn-bg: rgba(224, 164, 88, 0.14);
    --warn-border: rgba(224, 164, 88, 0.40);
    --warn-icon-bg: rgba(224, 164, 88, 0.24);
    --danger: #dd6259;
    --danger-ink: #200604;
    --muted: #9b9691;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }
  header {
    position: sticky;
    top: 0;
    padding: calc(var(--safe-top) + 14px) 16px 14px;
    margin-top: calc(-1 * var(--safe-top));
    background: var(--panel);
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    z-index: 10;
  }
  header .brand-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header .logo-mark {
    width: 38px; height: 38px; flex: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem;
  }
  header .brand-text { min-width: 0; }
  header .brand { font-weight: 700; letter-spacing: 0.2px; font-size: 1.02rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .tagline { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .header-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  header .icon-btn {
    background: none; border: none; color: var(--ink);
    font-size: 1.1rem; position: relative; padding: 6px 8px; line-height: 1;
    border-radius: 8px;
  }
  header .who { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
  main { padding: 16px; padding-bottom: 96px; max-width: 720px; margin: 0 auto; }
  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding-bottom: var(--safe-bottom);
    z-index: 10;
  }
  nav.tabs button {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    padding: 10px 4px 12px;
    font-size: 0.72rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  nav.tabs button .icon { font-size: 1.25rem; }
  nav.tabs button.active { color: var(--accent); font-weight: 600; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  h1 { font-size: 1.3rem; margin: 4px 0 16px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 4px; }
  input, select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 1rem;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1rem;
    font-weight: 600;
    margin-top: 14px;
  }
  button.primary:disabled { opacity: 0.5; }
  button.ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
  }
  .article-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    gap: 10px;
  }
  .article-row:last-child { border-bottom: none; }
  .article-row .name { font-weight: 600; font-size: 0.92rem; }
  .article-row .code { font-size: 0.78rem; color: var(--muted); }
  .stock-pill {
    font-size: 0.78rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .stock-pill.low { color: var(--danger); border-color: var(--danger); }
  .line-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .line-item .line-name { flex: 1; font-size: 0.9rem; }
  .line-item input[type=number] { width: 84px; }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }
  .success { color: var(--success); font-size: 0.9rem; margin-top: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .segmented { display: flex; gap: 6px; margin-top: 4px; }
  .segmented button {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 0.82rem;
  }
  .segmented button.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .accordion-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .commande-row.expanded { background: var(--paper); }
  #install-banner {
    display: none;
    position: fixed;
    left: 0; right: 0; top: var(--safe-top);
    z-index: 20;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 10px 14px;
    font-size: 0.82rem;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #install-banner.show { display: flex; }
  #install-banner button {
    background: rgba(0,0,0,0.15);
    border: none;
    color: inherit;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  #install-banner .close { background: none; padding: 6px; }

  #toast {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex;
    justify-content: center;
    padding-top: calc(var(--safe-top) + 10px);
    pointer-events: none;
  }
  #toast .bubble {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    transform: translateY(-140%);
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    max-width: 90vw;
    text-align: center;
  }
  #toast .bubble.error { background: var(--danger); color: #fff; }
  #toast.show .bubble { transform: translateY(0); }

  /* ---- Accueil (home) ---- */
  .badge-dot {
    position: absolute; top: -1px; right: 2px;
    background: var(--danger); color: var(--danger-ink);
    border-radius: 999px; font-size: 0.62rem; font-weight: 700;
    padding: 1px 5px; line-height: 1.25; min-width: 15px; text-align: center;
  }
  .greeting-card { margin-bottom: 16px; }
  .greeting-hello { font-size: 1.35rem; font-weight: 700; margin: 2px 0 2px; }
  .greeting-role { color: var(--muted); font-size: 0.88rem; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 20px 0 10px;
  }
  .section-head h2 { margin: 0; font-size: 1.02rem; }
  .section-head a { color: var(--accent); font-size: 0.82rem; text-decoration: none; font-weight: 600; }

  .pending-card {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
  }
  .pending-card .pending-head { display: flex; align-items: center; gap: 12px; }
  .pending-card .pending-icon {
    width: 36px; height: 36px; flex: none; border-radius: 50%;
    background: var(--warn-icon-bg);
    color: var(--warn);
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  .pending-card .pending-title { font-weight: 700; font-size: 0.95rem; }
  .pending-card .pending-sub { font-size: 0.78rem; color: var(--muted); }
  .pending-card .chevron { margin-left: auto; color: var(--muted); font-size: 1.1rem; }
  .pending-card .pending-line {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 9px 0 0; margin-top: 9px;
    border-top: 1px solid var(--warn-border);
    font-size: 0.85rem;
  }
  .pending-card .pending-line .pl-ref { font-weight: 600; }
  .pending-card .pending-line .pl-when { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }

  .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick-tile {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center;
    color: var(--ink);
  }
  .quick-tile .qt-icon { font-size: 1.5rem; }
  .quick-tile .qt-label { font-size: 0.8rem; font-weight: 700; line-height: 1.2; }
  .quick-tile .qt-sub { font-size: 0.68rem; color: var(--muted); line-height: 1.2; }
  .quick-tile.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .quick-tile.primary .qt-sub { color: var(--accent-ink); opacity: 0.75; }

  .movement-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .movement-row:last-child { border-bottom: none; }
  .movement-row .mv-icon {
    width: 38px; height: 38px; flex: none; border-radius: 10px;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
  }
  .movement-row .mv-name { font-weight: 700; font-size: 0.88rem; }
  .movement-row .mv-sub { font-size: 0.76rem; color: var(--muted); }
  .movement-row .mv-when { font-size: 0.76rem; color: var(--muted); white-space: nowrap; margin-left: auto; text-align: right; }

  .status-pill {
    font-size: 0.72rem; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .status-pill.approved { background: var(--success); color: var(--success-ink); }
  .status-pill.pending { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
  .status-pill.rejected { background: var(--danger); color: var(--danger-ink); }

  /* ---- Loading screen (startup splash) ------------------------------- */
  #loading-screen {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #f7f5f2;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loading-inner { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .loading-logo {
    width: 132px; height: auto; object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(58,26,18,0.18));
    margin-bottom: 22px;
    animation: loading-pop 0.6s ease both;
  }
  .loading-title {
    color: #3a1a12; font-weight: 800; font-size: 1.5rem; letter-spacing: 0.08em;
    animation: loading-fade-up 0.6s ease 0.1s both;
  }
  .loading-subtitle {
    color: #d98a5e; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.04em;
    margin-top: 4px;
    animation: loading-fade-up 0.6s ease 0.2s both;
  }
  .loading-spinner {
    display: flex; gap: 6px; margin-top: 28px;
    animation: loading-fade-up 0.6s ease 0.3s both;
  }
  .loading-spinner span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #c45a2a;
    animation: loading-bounce 1s ease-in-out infinite;
  }
  .loading-spinner span:nth-child(2) { animation-delay: 0.15s; }
  .loading-spinner span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes loading-pop {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes loading-fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes loading-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-8px); opacity: 1; }
  }

  /* Magasin / Production menus + production report screens */
  .big-menu { display: grid; gap: 12px; }
  .big-btn {
    display: flex; align-items: center; gap: 16px; width: 100%;
    padding: 22px 18px; text-align: left;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    font: inherit; cursor: pointer;
  }
  .big-btn:active { background: var(--panel-2); }
  .big-btn .bb-icon { font-size: 2.2rem; line-height: 1; }
  .big-btn .bb-text { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .big-btn .bb-label { font-weight: 700; font-size: 1.15rem; }
  .big-btn .bb-sub { font-size: 0.8rem; color: var(--muted); }
  .big-btn .bb-arrow { font-size: 1.6rem; color: var(--muted); }
  #backbar { max-width: 720px; margin: 0 auto; padding: 10px 16px 0; }
  #backbar:empty { display: none; }
  .back-btn { padding: 7px 14px; font-size: 0.9rem; }
  .prod-block > summary { cursor: pointer; font-weight: 600; font-size: 0.98rem; }
  .line-item input.pf { width: 96px; text-align: right; }
  .hours-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .hours-grid.two { grid-template-columns: repeat(2, 1fr); }
  .hours-grid.three { grid-template-columns: repeat(3, 1fr); }
  .hours-grid input.pf, .hours-grid select { width: 100%; padding: 9px 6px; font-size: 0.92rem; text-align: left; }
  .hours-grid > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-inner">
    <img src="assets/logo-splash.png" alt="Ideal Brique" class="loading-logo" />
    <div class="loading-title">IDEAL BRIQUE</div>
    <div class="loading-subtitle">Gestion de Stock</div>
    <div class="loading-spinner"><span></span><span></span><span></span></div>
  </div>
</div>

<div id="install-banner">
  <span id="install-banner-text"></span>
  <span style="display:flex;gap:6px">
    <button id="install-banner-action"></button>
    <button class="close" id="install-banner-close">✕</button>
  </span>
</div>
<div id="toast"><div class="bubble"></div></div>
<div id="app"></div>

<!--
  Loaded locally (not via node_modules import, which can't resolve in a
  plain WebView with no bundler). Order matters: capacitor.js builds the
  full Capacitor object on top of what the native Android bridge already
  injected, and push-notifications.js needs that in place before it can
  register itself as window.Capacitor.Plugins.PushNotifications. Both are
  harmless no-ops outside the native app (e.g. testing in a browser).
-->
<script src="vendor/capacitor.js"></script>
<script src="vendor/push-notifications.js"></script>

<script>
(function () {
  // ---- Config -------------------------------------------------------
  // Point this at wherever you deploy the backend/ connector service.
  // Also editable in-app from the login screen (⚙ Adresse du serveur) —
  // useful on a real device where there's no browser console to set it from.
  function getApiBase() {
    return window.localStorage.getItem('gmao_api_base') || 'http://localhost:4000/api';
  }

  // Must match backend/src/roles.js exactly - only used here to decide
  // which tabs to show; the backend is the real enforcement point.
  const ADMIN_ROLES = ['Administrateur'];
  const MANAGER_ROLES = ['Administrateur', 'Responsable Méthode', 'Responsable Magasin', 'Magasinier'];
  const isManager = () => state.user && MANAGER_ROLES.includes(state.user.fonction);
  // Same rule as the desktop and the server: everyone but the Administrateur
  // role can create a demande d'achat (the server enforces it too).
  const canCreateDa = () => state.user && state.user.fonction !== 'Administrateur';
  const isAdmin = () => state.user && ADMIN_ROLES.includes(state.user.fonction);

  // ---- Tiny state / storage helpers ----------------------------------
  const state = {
    token: null,
    user: null,
    tab: 'accueil',
    theme: null,
    articles: [],
    search: '',
    selectedArticle: null,
    bsmLines: [],
    daLines: [],
    sub: { bsm: 'new', brm: 'new', da: 'new', atelier: 'open' },
    prod: null,
    daOptions: null,
    receptionCommande: null,
    receptionLines: [],
    error: '',
    notice: ''
  };

  function loadSession() {
    try {
      const raw = localStorage.getItem('gmao_session');
      if (raw) {
        const s = JSON.parse(raw);
        state.token = s.token;
        state.user = s.user;
      }
    } catch (e) {}
  }
  function saveSession() {
    localStorage.setItem('gmao_session', JSON.stringify({ token: state.token, user: state.user }));
  }
  function clearSession() {
    clearApiCache();
    localStorage.removeItem('gmao_session');
    state.token = null;
    state.user = null;
  }

  // ---- Theme (dark/light) ----------------------------------------------
  // 'dark' or 'light' persisted explicitly; if the person never chose one,
  // we don't force anything - the CSS's prefers-color-scheme media query
  // already follows the OS setting on its own.
  function loadTheme() {
    try {
      state.theme = localStorage.getItem('gmao_theme') || null;
    } catch (e) { state.theme = null; }
    applyTheme();
  }
  function applyTheme() {
    if (state.theme === 'dark' || state.theme === 'light') {
      document.documentElement.setAttribute('data-theme', state.theme);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }
  function toggleTheme() {
    // First tap flips away from whatever is currently showing, regardless
    // of whether that came from an explicit choice or the OS default.
    const currentlyDark = state.theme
      ? state.theme === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    state.theme = currentlyDark ? 'light' : 'dark';
    try { localStorage.setItem('gmao_theme', state.theme); } catch (e) {}
    applyTheme();
    render();
  }

  // ---- Data usage -----------------------------------------------------
  // Everything the app downloads goes through api(). To keep mobile data
  // use low it:
  //  - keeps short-lived copies of read-only answers in memory (the same
  //    list opened twice within a minute is not downloaded twice),
  //  - clears them as soon as anything is written (so nothing looks stale),
  //  - shares one request between identical simultaneous calls,
  //  - gives up after 25 s instead of hanging on a bad network.
  // Automatic refreshes (bell badge, Accueil lists) are skipped on mobile
  // data when "Économie de données" is on (see skipBackground()).
  const apiCache = new Map();   // key -> { at, data }
  const apiInflight = new Map();
  const CACHE_RULES = [
    [/^\/reference-data\//, 600000],
    [/^\/da\/options/, 600000],
    [/^\/notifications\/unread-count/, 60000],
    [/^\/(movements\/mine|bsm\/pending|brm\/pending)/, 60000],
    [/^\/articles\?/, 30000],
    [/^\/atelier\/of\?/, 30000]
  ];
  function cacheTtl(path) {
    const r = CACHE_RULES.find(([re]) => re.test(path));
    return r ? r[1] : 0;
  }
  function clearApiCache() { apiCache.clear(); apiInflight.clear(); }

  function dataSaverOn() {
    try { return localStorage.getItem('gmao_data_saver') !== '0'; } catch (e) { return true; }
  }
  function onMeteredNetwork() {
    const c = navigator.connection;      // Android WebView: type is 'wifi' | 'cellular' | ...
    return !!c && (c.type === 'cellular' || c.saveData === true);
  }
  // True when automatic (not user-triggered) downloads should wait.
  function skipBackground() { return dataSaverOn() && onMeteredNetwork(); }

  async function networkFetch(path, options) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort('timeout'), 25000);
    if (options.signal) options.signal.addEventListener('abort', () => ctrl.abort('cancelled'));
    try {
      const res = await fetch(getApiBase() + path, {
        ...options,
        signal: ctrl.signal,
        headers: {
          'Content-Type': 'application/json',
          ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
          ...(options.headers || {})
        },
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    } catch (e) {
      if (e.name === 'AbortError' || ctrl.signal.aborted) {
        const err = new Error(ctrl.signal.reason === 'cancelled' ? 'cancelled' : 'Réseau trop lent ou serveur injoignable.');
        err.cancelled = ctrl.signal.reason === 'cancelled';
        throw err;
      }
      if (e instanceof TypeError) throw new Error('Serveur injoignable. Vérifiez la connexion et l\'adresse du serveur.');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function api(path, options = {}) {
    const method = (options.method || 'GET').toUpperCase();
    if (method !== 'GET') {
      try { return await networkFetch(path, options); }
      finally { clearApiCache(); }          // anything may have changed
    }
    const ttl = options.fresh ? 0 : cacheTtl(path);
    const key = (state.user ? state.user.id : '') + '|' + path;
    if (ttl > 0) {
      const hit = apiCache.get(key);
      if (hit && Date.now() - hit.at < ttl) return hit.data;
    }
    const run = async () => {
      const data = await networkFetch(path, options);
      if (cacheTtl(path) > 0) apiCache.set(key, { at: Date.now(), data });
      return data;
    };
    if (options.signal) return run();       // cancellable calls are not shared
    if (apiInflight.has(key)) return apiInflight.get(key);
    const p = run().finally(() => apiInflight.delete(key));
    apiInflight.set(key, p);
    return p;
  }

  function timeAgo(dateStr) {
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "À l'instant";
    if (mins < 60) return `Il y a ${mins} min`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `Il y a ${hours} h`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `Il y a ${days} j`;
    return new Date(dateStr).toLocaleDateString('fr-FR');
  }

        body: {
          id_receptionniste, n_ot, type_stock,
          lines: state.bsmLines.map((l) => ({ id_article: l.id, quantite: l.qty }))
        }
      });
      okBox.textContent = 'Sortie enregistrée.';
      showToast(result.pending ? '⏳ Sortie enregistrée, en attente de validation' : '✓ Sortie validée avec succès');
      state.bsmLines = [];
      renderLines('lines', state.bsmLines);
    } catch (e) {
      errBox.textContent = e.message;
    }
  }


  // ---- Demande d'achat (DA) tab ----------------------------------------
  // Mirrors the desktop "creer_da" form. Approval stays in the desktop app.

    const main = root || document.getElementById('main');
    main.innerHTML = `
      <div class="card">
        <h2>Nouvelle demande d'achat</h2>
        <div id="da-head"><div class="empty">Chargement…</div></div>
      </div>
      <div class="card">
        <h2>Articles</h2>
        <label>Ajouter un article</label>
        <input id="da-search" placeholder="Chercher un article…" />
        <div id="da-suggestions"></div>
        <div id="da-lines"></div>
        <button class="primary" id="submit-da">Envoyer la demande</button>
        <div class="error" id="da-error"></div>
        <div class="success" id="da-success"></div>
      </div>
    `;
    try {
      state.daOptions = await api('/da/options');
    } catch (e) {
      document.getElementById('da-head').innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      return;
    }
    const o = state.daOptions;

    }
    document.getElementById('da-head').innerHTML = `
      ${o.can_choose_demandeur ? `
        <label>Demandeur</label>
        <select id="da-demandeur">${o.demandeurs.map((d) =>
          `<option value="${d.id}" ${d.id === o.me.id ? 'selected' : ''}>${escapeHtml(d.login)}</option>`).join('')}</select>`
        : `<div class="muted">Demandeur : ${escapeHtml(o.me.login)}</div>`}
      <label>Délai (jours)</label>
      <input id="da-delai" type="number" min="1" step="1" value="7" />
      <label>Période</label>
      <select id="da-periode">${o.periodes.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select>
    `;
    wireArticlePicker('da-search', 'da-suggestions', addDaLine);
    renderDaLines();
    document.getElementById('submit-da').onclick = submitDa;
  }

  function renderDaMine(root) {
    root.innerHTML = `
      <div class="card">
        <h2>Mes demandes d'achat</h2>
        <div id="da-mine"><div class="empty">Chargement…</div></div>
      </div>`;
    loadMyDas();
  }

  async function addDaLine(art) {
    if (state.daLines.some((l) => l.id === art.id)) return;
    const line = { id: art.id, name: art.name, qty: 1, motif: '', requires_equipement: false, equipements: [], selected: [] };
    state.daLines.push(line);
    renderDaLines();
    try {
      const r = await api(`/da/articles/${art.id}/equipements`);
      line.requires_equipement = !!r.requires_equipement;
      line.equipements = r.equipements || [];
      renderDaLines();
    } catch (e) {
      showToast(e.message, true);
    }
  }

  function renderDaLines() {
    const box = document.getElementById('da-lines');
    if (!box) return;
    if (state.daLines.length === 0) {
      box.innerHTML = '<div class="empty">Aucun article ajouté</div>';
      return;
    }
    box.innerHTML = state.daLines.map((l, i) => `
      <div class="card" style="margin:8px 0;padding:10px">
        <div class="line-item" style="padding:0">
          <div class="line-name">${escapeHtml(l.name)}</div>
          <input type="number" min="0.01" step="0.01" value="${l.qty}" data-idx="${i}" class="da-qty" />
          <button class="ghost" data-idx="${i}" data-action="da-remove">✕</button>
        </div>
        ${l.requires_equipement ? `
          <label>Équipements concernés</label>
          ${l.equipements.length === 0 ? '<div class="muted">Aucun équipement lié</div>' : l.equipements.map((e) => `
            <label style="display:flex;gap:8px;align-items:center;margin:4px 0">
              <input type="checkbox" data-idx="${i}" data-eq="${e.id}" class="da-eq" ${l.selected.includes(e.id) ? 'checked' : ''} style="width:auto" />
              <span>${escapeHtml(e.designation || e.nom || e.code || ('#' + e.id))}</span>
            </label>`).join('')}`
        : `
          <label>Motif</label>
          <textarea data-idx="${i}" class="da-motif" maxlength="500" rows="2" placeholder="Pourquoi cet article ?">${escapeHtml(l.motif)}</textarea>`}
      </div>
    `).join('');
    box.querySelectorAll('.da-qty').forEach((inp) => {
      inp.oninput = () => { state.daLines[Number(inp.dataset.idx)].qty = Number(inp.value); };
    });
    box.querySelectorAll('.da-motif').forEach((inp) => {
      inp.oninput = () => { state.daLines[Number(inp.dataset.idx)].motif = inp.value; };
    });
    box.querySelectorAll('.da-eq').forEach((inp) => {
      inp.onchange = () => {
        const l = state.daLines[Number(inp.dataset.idx)];
        const id = Number(inp.dataset.eq);
        l.selected = inp.checked ? [...new Set([...l.selected, id])] : l.selected.filter((x) => x !== id);
      };
    });
    box.querySelectorAll('[data-action=da-remove]').forEach((btn) => {
      btn.onclick = () => { state.daLines.splice(Number(btn.dataset.idx), 1); renderDaLines(); };
    });
  }

  async function submitDa() {
    const errBox = document.getElementById('da-error');
    const okBox = document.getElementById('da-success');
    errBox.textContent = ''; okBox.textContent = '';
    const delai = Number(document.getElementById('da-delai').value);
    const periode = document.getElementById('da-periode').value;
    const dem = document.getElementById('da-demandeur');
    if (!(delai > 0)) { errBox.textContent = 'Indiquez un délai supérieur à 0.'; return; }
    if (state.daLines.length === 0) { errBox.textContent = 'Ajoutez au moins un article.'; return; }
    for (const l of state.daLines) {
      if (!(l.qty > 0)) { errBox.textContent = `Quantité invalide : ${l.name}`; return; }
      if (l.requires_equipement && l.selected.length === 0) { errBox.textContent = `Choisissez au moins un équipement : ${l.name}`; return; }
      if (!l.requires_equipement && !l.motif.trim()) { errBox.textContent = `Indiquez un motif : ${l.name}`; return; }
    }
    const btn = document.getElementById('submit-da');
    btn.disabled = true;
    try {
      await api('/da', {
        method: 'POST',
        body: {
          delai, periode,
          ...(dem ? { id_demandeur: Number(dem.value) } : {}),
          lines: state.daLines.map((l) => ({
            id_article: l.id, qt: l.qty,
            motif: l.requires_equipement ? '' : l.motif.trim(),
            id_equipements: l.requires_equipement ? l.selected : []
          }))
        }
      });
      showToast('✓ Demande d\'achat envoyée');
      okBox.textContent = 'Demande envoyée.';
      state.daLines = [];
      state.sub.da = 'mine';   // show the request in the list right away
      renderTab();
    } catch (e) {
      errBox.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  }

  async function loadMyDas() {
    const box = document.getElementById('da-mine');
    if (!box) return;
    try {
      const rows = await api('/da/mine');
      if (rows.length === 0) { box.innerHTML = '<div class="empty">Aucune demande</div>'; return; }
      box.innerHTML = rows.map((d) => `
        <div class="article-row" style="display:block">
          <div class="name">DA #${d.id} · ${escapeHtml(d.statut_label)}</div>
          <div class="code">${d.date_da ? new Date(d.date_da).toLocaleDateString('fr-FR') : ''}${d.demandeur ? ' · ' + escapeHtml(d.demandeur) : ''}</div>
          ${(d.lines || []).map((l) => `<div class="code">• ${escapeHtml(l.designation || l.code_article || 'Article')} × ${l.qt}</div>`).join('')}
          ${d.cause ? `<div class="error">Refus : ${escapeHtml(d.cause)}</div>` : ''}
        </div>`).join('');
    } catch (e) {
      box.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
    }
  }


  // ---- Atelier: solder / réceptionner un OF (ordre de fabrication) -------
  // Same rules as the desktop reception screen: each reception adds to the
  // stock; the OF becomes "Partiellement Soldé" until everything ordered is
  // received, then "Soldé". The server enforces all of it.
  function ofStatusPill(etat) {
    const low = etat !== 'Soldé' && etat !== 'Partiellement Soldé';
    return `<span class="stock-pill ${low ? 'low' : ''}">${escapeHtml(etat || '—')}</span>`;
  }
  const fmtQty = (n) => String(Math.round(Number(n) * 10000) / 10000);

  async function renderAtelierList(root, statut) {
    root.innerHTML = `
      <div class="card">
        <input id="of-search" placeholder="N° OF, code ou désignation…" value="${escapeHtml(state.ofSearch || '')}" />
      </div>
      <div class="card" id="of-results"><div class="empty">Chargement…</div></div>`;
    const input = document.getElementById('of-search');
    const load = async () => {
      const box = document.getElementById('of-results');
      if (!box) return;
      try {
        const rows = await api(`/atelier/of?statut=${statut}&search=${encodeURIComponent(state.ofSearch || '')}`);
        if (rows.length === 0) { box.innerHTML = '<div class="empty">Aucun OF</div>'; return; }
        box.innerHTML = rows.map((o) => `
          <div class="article-row" data-of="${o.id}" style="cursor:pointer">
            <div>
              <div class="name">OF ${escapeHtml(o.n_of)} · ${escapeHtml(o.designation || '')}</div>
              <div class="code">${escapeHtml(o.code_article || '')} · reçu ${fmtQty(o.qt_recue)} / ${fmtQty(o.quantite)}${o.date_prevu ? ' · prévu ' + new Date(o.date_prevu).toLocaleDateString('fr-FR') : ''}</div>
            </div>
            ${ofStatusPill(o.etat)}
          </div>`).join('');
        box.querySelectorAll('[data-of]').forEach((row) => { row.onclick = () => openOfSheet(Number(row.dataset.of)); });
      } catch (e) {
        box.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      }
    };
    input.oninput = debounce(() => { state.ofSearch = input.value.trim(); load(); }, 300);
    load();
  }

  async function openOfSheet(idOf) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:40;display:flex;align-items:flex-end';
    overlay.innerHTML = '<div id="of-sheet" style="background:var(--panel);width:100%;max-height:85vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + var(--safe-bottom))"><div class="empty">Chargement…</div></div>';
    document.body.appendChild(overlay);
    const sheet = overlay.querySelector('#of-sheet');
    let changed = false;
    const close = () => { overlay.remove(); if (changed) renderTab(); };
    overlay.onclick = (e) => { if (e.target === overlay) close(); };

    async function draw() {
      let of;
      try { of = await api('/atelier/of/' + idOf); }
      catch (e) { sheet.innerHTML = `<div class="error">${escapeHtml(e.message)}</div><button class="ghost" id="of-close" style="width:100%">Fermer</button>`; sheet.querySelector('#of-close').onclick = close; return; }
      const canReceive = of.can_write && of.reste > 0;
      const today = new Date(); const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      sheet.innerHTML = `
        <h2 style="margin-top:0">OF ${escapeHtml(of.n_of)}</h2>
        <div style="margin-bottom:4px"><strong>${escapeHtml(of.designation || '')}</strong></div>
        <div class="muted">${escapeHtml(of.code_article || '')}</div>
        <div style="margin:10px 0">${ofStatusPill(of.etat)}
          <span class="muted"> demandé ${fmtQty(of.quantite)} · reçu ${fmtQty(of.qt_recue)} · reste ${fmtQty(of.reste)}</span></div>
        ${of.receptions.length ? `<label>Réceptions</label>` + of.receptions.map((r) => `
          <div class="line-item">
            <div class="line-name">${new Date(r.date_reception).toLocaleDateString('fr-FR')} · ${fmtQty(r.qt_recu)}</div>
            ${of.can_write ? `<button class="ghost" data-undo="${r.id}" title="Annuler cette réception">✕</button>` : ''}
          </div>`).join('') : ''}
        ${canReceive ? `
          <label>Quantité reçue</label>
          <input id="of-qty" type="number" min="0.01" max="${of.reste}" step="0.01" value="${of.reste}" />
          <label>Date de réception</label>
          <input id="of-date" type="date" max="${iso}" value="${iso}" />
          <button class="primary" id="of-go"></button>
          <div class="error" id="of-error"></div>` : (of.reste <= 0 ? '<div class="success" style="margin-top:8px">Cet OF est entièrement soldé.</div>' : '')}
        <button class="ghost" id="of-close" style="width:100%;margin-top:8px">Fermer</button>`;
      sheet.querySelector('#of-close').onclick = close;

      const qtyEl = sheet.querySelector('#of-qty'), goEl = sheet.querySelector('#of-go');
      if (qtyEl) {
        // The button says what the result will be, as in the desktop app.
        const label = () => {
          const q = Number(qtyEl.value);
          goEl.textContent = q > 0 && Math.abs(q - of.reste) < 1e-4 ? '✓ Solder l\'OF' : 'Réceptionner (partiel)';
        };
        qtyEl.oninput = label; label();
        goEl.onclick = async () => {
          const err = sheet.querySelector('#of-error'); err.textContent = '';
          const qt = Number(qtyEl.value);
          if (!(qt > 0)) { err.textContent = 'Saisissez une quantité supérieure à 0.'; return; }
          if (qt > of.reste + 1e-4) { err.textContent = `Maximum : ${fmtQty(of.reste)}.`; return; }
          goEl.disabled = true;
          try {
            const r = await api(`/atelier/of/${idOf}/receptions`, { method: 'POST', body: { qt, date: sheet.querySelector('#of-date').value } });
            changed = true;
            showToast(r.etat === 'Soldé' ? '✓ OF soldé' : '✓ Réception enregistrée (partiellement soldé)');
            draw();
          } catch (e) { err.textContent = e.message; goEl.disabled = false; }
        };
      }
      sheet.querySelectorAll('[data-undo]').forEach((b) => {
        b.onclick = async () => {
          if (!confirm('Annuler cette réception ? La quantité sera retirée du stock.')) return;
          try {
            await api(`/atelier/of/${idOf}/receptions/${b.dataset.undo}`, { method: 'DELETE' });
            changed = true; showToast('Réception annulée'); draw();
          } catch (e) { showToast(e.message, true); }
        };
      });
    }
    draw();
  }

  // ---- Magasin / Production menus -------------------------------------
  // Two bottom-nav entries. Each opens a menu of big buttons; a button opens
  // the screen it names, with a "‹" button to come back to the menu.
  function bigButton(id, icon, label, sub) {
    return `<button type="button" class="big-btn" data-go="${id}">
      <span class="bb-icon">${icon}</span>
      <span class="bb-text"><span class="bb-label">${label}</span><span class="bb-sub">${sub}</span></span>
      <span class="bb-arrow">›</span>
    </button>`;
  }

  function renderMagasin() {
    const items = [bigButton('bsm', '📤', 'BSM', 'Bon de sortie magasin')];
    items.push(bigButton('brm', '↩️', 'BRM', 'Bon de retour magasin'));
    if (canCreateDa()) items.push(bigButton('da', '🛒', 'DA', "Demande d'achat"));
    if (isManager()) items.push(bigButton('reception', '📥', 'Réception', 'Bons de commande en attente'));
    document.getElementById('main').innerHTML = `<div class="big-menu">${items.join('')}</div>`;
    document.querySelectorAll('.big-btn').forEach((b) => {
      b.onclick = () => { state.tab = b.dataset.go; state.error = ''; state.notice = ''; renderTab(); };
    });
  }

  function renderProductionMenu() {
    document.getElementById('main').innerHTML = `<div class="big-menu">
      ${bigButton('rapports', '📝', 'Rapport de production', 'Remplir les rapports Jour / Soir / Nuit')}
      ${bigButton('atelier', '🏭', 'Ordres de fabrication', 'Consulter et solder les OF')}
    </div>`;
    document.querySelectorAll('.big-btn').forEach((b) => {
      b.onclick = () => { state.tab = b.dataset.go; state.error = ''; state.notice = ''; renderTab(); };
    });
  }

  // ---- Production reports (mirrors the desktop "Rapport" screens) --------
  const POSTES = ['Jour', 'Soir', 'Nuit'];
  const PROD_SECTIONS = [
    ['fabrication', '🧱', 'Fabrication', 'Produits, tonnage, mesures, chef d\'équipe'],
    ['four', '🔥', 'Four', 'Entrée, sortie, mesures'],
    ['preparation', '⚗️', 'Préparation', 'Mesures, A/S, général'],
    ['fuel', '⛽', 'Fuel', 'Consommations'],
    ['emballage', '📦', 'Emballage', 'Produits, palettes, chef d\'équipe']
  ];
  const isoDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const frDate = (iso) => String(iso).split('-').reverse().join('/');

  function setBack(label, fn) {
    const bar = document.getElementById('backbar');
    if (!bar) return;
    if (!label) { bar.innerHTML = ''; return; }
    bar.innerHTML = `<button type="button" class="ghost back-btn" id="back-btn">‹ ${escapeHtml(label)}</button>`;
    document.getElementById('back-btn').onclick = fn;
  }

  function prodState() {
    if (!state.prod) state.prod = { view: 'list', id: null, section: null, unit: {}, data: null, date: '', poste: '' };
    return state.prod;
  }

  function renderRapports() {
    const P = prodState();
    if (P.view === 'list') return renderRapportList();
    if (!P.data) return openReport(P.id);
    if (P.view === 'report') return renderRapportHome();
    return renderRapportSection();
  }

  async function renderRapportList() {
    const P = prodState();
    const main = document.getElementById('main');
    setBack('Production', () => { state.tab = 'production'; renderTab(); });
    main.innerHTML = '<div class="card"><div class="empty">Chargement…</div></div>';
    let res;
    try { res = await api('/production/reports'); }
    catch (e) { main.innerHTML = `<div class="card"><div class="error">${escapeHtml(e.message)}</div></div>`; return; }
    if (state.tab !== 'rapports' || P.view !== 'list') return;
    const today = isoDate();
    if (!P.date) P.date = today;
    main.innerHTML = `
      ${res.can_write ? `<div class="card">
        <h2>Nouveau rapport</h2>
        <label>Date</label>
        <input id="rp-date" type="date" max="${today}" value="${P.date}" />
        <label>Poste</label>
        <div class="segmented" id="rp-poste">${POSTES.map((p) => `<button type="button" data-v="${p}" class="${p === P.poste ? 'selected' : ''}">${p}</button>`).join('')}</div>
        <button class="primary" id="rp-create" style="margin-top:12px">Créer le rapport</button>
        <div class="error" id="rp-err"></div>
      </div>` : ''}
      <div class="card">
        <h2>Rapports récents</h2>
        <div id="rp-list">${res.reports.length === 0 ? '<div class="empty">Aucun rapport</div>' : res.reports.map((r) => `
          <div class="article-row" data-rp="${r.id}" style="cursor:pointer">
            <div><div class="name">${frDate(r.date_rapport)} · ${escapeHtml(r.poste)}</div><div class="code">Rapport n° ${r.id}</div></div>
            ${res.can_write ? `<button type="button" class="ghost" data-del="${r.id}" title="Supprimer ce rapport">✕</button>` : '<span class="muted">›</span>'}
          </div>`).join('')}</div>
      </div>`;
    main.querySelectorAll('[data-rp]').forEach((row) => {
      row.onclick = (e) => { if (e.target.closest('[data-del]')) return; openReport(Number(row.dataset.rp)); };
    });
    main.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm('Supprimer ce rapport ? Le tonnage de fabrication sera retiré des compteurs.')) return;
        try { await api('/production/reports/' + b.dataset.del, { method: 'DELETE' }); showToast('Rapport supprimé'); renderRapportList(); }
        catch (e) { showToast(e.message, true); }
      };
    });
    const create = document.getElementById('rp-create');
    if (create) {
      document.getElementById('rp-date').onchange = (e) => { P.date = e.target.value; };
      main.querySelectorAll('#rp-poste button').forEach((b) => {
        b.onclick = () => { P.poste = b.dataset.v; main.querySelectorAll('#rp-poste button').forEach((x) => x.classList.toggle('selected', x === b)); };
      });
      create.onclick = async () => {
        const err = document.getElementById('rp-err'); err.textContent = '';
        if (!P.poste) { err.textContent = 'Choisissez le poste.'; return; }
        create.disabled = true;
        try {
          const r = await api('/production/reports', { method: 'POST', body: { date: P.date, poste: P.poste } });
          showToast('✓ Rapport créé');
          P.poste = '';
          openReport(r.id);
        } catch (e) { err.textContent = e.message; create.disabled = false; }
      };
    }
  }

  async function openReport(id) {
    const P = prodState();
    const main = document.getElementById('main');
    P.id = id; P.view = 'report'; P.section = null; P.data = null;
    setBack('Rapports', () => { P.view = 'list'; P.data = null; renderRapports(); });
    main.innerHTML = '<div class="card"><div class="empty">Chargement…</div></div>';
    try { await reloadReport(); }
    catch (e) { main.innerHTML = `<div class="card"><div class="error">${escapeHtml(e.message)}</div></div>`; return; }
    renderRapports();
  }

  async function reloadReport() {
    const P = prodState();
    P.data = await api('/production/reports/' + P.id, { fresh: true });
  }

  function renderRapportHome() {
    const P = prodState(); const d = P.data;
    const main = document.getElementById('main');
    setBack('Rapports', () => { P.view = 'list'; P.data = null; renderRapports(); });
    main.innerHTML = `
      <div class="card">
        <h2>Rapport du ${frDate(d.date_rapport)} · ${escapeHtml(d.poste)}</h2>
        ${d.can_write ? '<div class="muted">Touchez une section pour la remplir.</div>' : '<div class="muted">Lecture seule.</div>'}
      </div>
      <div class="big-menu">${PROD_SECTIONS.map(([k, icon, label, sub]) => bigButton(k, icon, label, sub)).join('')}</div>`;
    main.querySelectorAll('.big-btn').forEach((b) => {
      b.onclick = () => { P.view = 'section'; P.section = b.dataset.go; renderRapports(); };
    });
  }

  // -- helpers shared by the section screens
  const pIn = (attrs, v, ro) => `<input class="pf" type="text" inputmode="decimal" autocomplete="off" ${attrs} value="${v === null || v === undefined ? '' : escapeHtml(String(Math.round(Number(v) * 10000) / 10000))}" ${ro ? 'disabled' : ''} />`;
  const pRow = (name, inner) => `<div class="line-item"><div class="line-name">${escapeHtml(name)}</div>${inner}</div>`;

  function unitPicker(section, units) {
    const P = prodState();
    if (units.length === 0) return { unit: null, html: '<div class="card"><div class="empty">Aucune unité pour cette section.</div></div>' };
    let cur = units.find((u) => u.id_unite === P.unit[section]) || units[0];
    P.unit[section] = cur.id_unite;
    const html = units.length > 1
      ? `<div class="card" style="padding:10px"><div class="segmented" id="unit-nav">${units.map((u) => `<button type="button" data-u="${u.id_unite}" class="${u.id_unite === cur.id_unite ? 'selected' : ''}">${escapeHtml(u.unite)}</button>`).join('')}</div></div>`
      : `<div class="muted" style="margin:0 2px 8px">${escapeHtml(cur.unite)}</div>`;
    return { unit: cur, html };
  }

  // One group of fields with its own save button.
  function block(title, body, id, canWrite, note) {
    return `<details class="card prod-block" ${id === 'open' ? 'open' : ''}>
      <summary>${title}</summary>
      ${note ? `<div class="muted" style="margin:6px 0">${note}</div>` : ''}
      ${body}
      ${canWrite ? '<button type="button" class="primary prod-save" style="margin-top:12px">Enregistrer</button>' : ''}
      <div class="error"></div>
    </details>`;
  }

  // Re-draws the current screen and keeps the same blocks open.
  async function rerenderKeepOpen() {
    const open = [...document.querySelectorAll('#main details')].map((x) => x.open);
    await renderRapports();
    document.querySelectorAll('#main details').forEach((x, k) => { x.open = !!open[k]; });
  }

  // Pairs the blocks that have a save button (in order) with saves[i](blockEl)
  // -> { method?, path, body, toast? }; a save may throw a message to show.
  function wireBlocks(root, saves) {
    const els = [...root.querySelectorAll('details.prod-block:not(.anomalies)')].filter((e) => e.querySelector('.prod-save'));
    els.forEach((el, i) => {
      const btn = el.querySelector('.prod-save');
      if (!saves[i]) return;
      btn.onclick = async () => {
        const err = el.querySelector('.error'); err.textContent = '';
        let req;
        try { req = saves[i](el); } catch (e) { err.textContent = e.message; return; }
        btn.disabled = true;
        try {
          const r = await api(req.path, { method: req.method || 'PUT', body: req.body });
          await reloadReport();
          showToast(req.toast ? req.toast(r) : '✓ Enregistré');
          await rerenderKeepOpen();
        } catch (e) { err.textContent = e.message; btn.disabled = false; }
      };
    });
  }

  const readNum = (el) => el.value.trim();
  const rowsOf = (el, attr, fields) => [...el.querySelectorAll(`[data-${attr}]`)].reduce((acc, inp) => {
    const id = Number(inp.dataset[attr]);
    let row = acc.find((r) => r.id === id);
    if (!row) { row = { id }; acc.push(row); }
    row[inp.dataset.f || 'valeur'] = readNum(inp);
    return acc;
  }, []);

  function anomalyBlock(d, unit) {
    const list = d.anomalies.filter((a) => a.id_unite === unit.id_unite);
    const opts = d.anomalie_options[unit.id_unite] || [];
    return `<details class="card prod-block anomalies" data-unit="${unit.id_unite}">
      <summary>Arrêts / anomalies${list.length ? ` (${list.length})` : ''}</summary>
      ${list.map((a) => `<div class="line-item"><div class="line-name">${escapeHtml(a.anomalie)}<br><span class="muted">${a.duree} min</span></div>${d.can_write ? `<button type="button" class="ghost" data-adel="${a.id}">✕</button>` : ''}</div>`).join('')}
      ${d.can_write && opts.length ? `
        <label>Anomalie</label>
        <select class="an-sel">${opts.map((o) => `<option value="${o.id}">${escapeHtml(o.anomalie)}</option>`).join('')}</select>
        <label>Durée (minutes)</label>
        <input class="an-dur" type="text" inputmode="numeric" placeholder="ex. 45" />
        <button type="button" class="primary an-add" style="margin-top:12px">Ajouter</button>` : ''}
      <div class="error"></div>
    </details>`;
  }

  function wireAnomalies(root) {
    const P = prodState();
    root.querySelectorAll('details.anomalies').forEach((el) => {
      const unit = Number(el.dataset.unit);
      const err = el.querySelector('.error');
      const refresh = async (msg) => { await reloadReport(); showToast(msg); await rerenderKeepOpen(); };
      const add = el.querySelector('.an-add');
      if (add) add.onclick = async () => {
        err.textContent = '';
        const duree = Number(el.querySelector('.an-dur').value.trim());
        if (!Number.isInteger(duree) || duree <= 0) { err.textContent = 'Durée : nombre entier de minutes supérieur à 0.'; return; }
        add.disabled = true;
        try {
          await api(`/production/reports/${P.id}/anomalies`, { method: 'POST', body: { id_unite: unit, id_anomalie: Number(el.querySelector('.an-sel').value), duree } });
          await refresh('✓ Anomalie ajoutée');
        } catch (e) { err.textContent = e.message; add.disabled = false; }
      };
      el.querySelectorAll('[data-adel]').forEach((b) => {
        b.onclick = async () => {
          if (!confirm('Supprimer cette anomalie ?')) return;
          try { await api(`/production/reports/${P.id}/anomalies/${b.dataset.adel}`, { method: 'DELETE' }); await refresh('Anomalie supprimée'); }
          catch (e) { err.textContent = e.message; }
        };
      });
    });
  }

  function chefBlock(unit, chefs, ro) {
    return block("Chef d'équipe", `
      <select class="cf-sel" ${ro ? 'disabled' : ''}>
        <option value="0">— choisir —</option>
        ${chefs.map((c) => `<option value="${c.id}" ${c.id === unit.id_cf ? 'selected' : ''}>${escapeHtml(c.nom)}</option>`).join('')}
      </select>`, '', !ro);
  }

  async function renderRapportSection() {
    const P = prodState(); const d = P.data; const sec = P.section;
    const main = document.getElementById('main');
    const meta = PROD_SECTIONS.find((s) => s[0] === sec);
    setBack('Rapport', () => { P.view = 'report'; P.section = null; renderRapports(); });
    const ro = !d.can_write;
    const base = `/production/reports/${P.id}`;
    const head = `<div class="card"><h2>${meta[1]} ${meta[2]} · ${frDate(d.date_rapport)} · ${escapeHtml(d.poste)}</h2>${ro ? '<div class="muted">Lecture seule.</div>' : ''}</div>`;

    if (sec === 'fuel') {
      main.innerHTML = head + block('Consommations de fuel', d.fuel.map((f) => pRow(`Qt Fuel ${f.label}`, pIn(`data-fuel="${f.type}"`, f.quantite, ro))).join(''), 'open', !ro, 'Laissez vide un champ non renseigné.');
      wireBlocks(main, [(el) => {
        const valeurs = {};
        el.querySelectorAll('[data-fuel]').forEach((i) => { valeurs[i.dataset.fuel] = readNum(i); });
        return { path: `${base}/fuel`, body: { valeurs } };
      }]);
      return;
    }

    let units = []; let chefs = [];
    if (sec === 'fabrication') units = d.fabrication;
    if (sec === 'four') units = d.four;
    if (sec === 'preparation') units = d.preparation.unites;
    if (sec === 'emballage') units = d.emballage;
    if ((sec === 'fabrication' || sec === 'emballage') && !ro) {
      try { chefs = await api('/production/chefs'); } catch (e) { chefs = []; }
      if (P.view !== 'section' || P.section !== sec) return;
    }
    const { unit, html } = unitPicker(sec, units);
    let blocks = ''; const saves = [];
    const S = (cond, fn) => { if (!ro && cond) saves.push(fn); };
    const unitUrl = (part) => `${base}/${sec}/${unit.id_unite}/${part}`;

    if (unit && sec === 'fabrication') {
      const prodOpts = (sel) => `<option value="0">— choisir —</option>` + d.produits.map((p) => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${escapeHtml(p.designation)}</option>`).join('');
      blocks += block('Production et tonnage', `
          ${unit.produits.map((p) => pRow(p.designation, pIn(`data-q="${p.id}" data-f="quantite"`, p.quantite, ro))).join('')}
          <label style="margin-top:14px">Produit fabriqué à chaque heure d'échantillonnage</label>
          <div class="hours-grid two">${unit.heures.map((h, k) => `<div><span class="muted">H${k + 1}</span><select data-h="${k}" ${ro ? 'disabled' : ''}>${prodOpts(h)}</select></div>`).join('')}</div>
          <div style="margin-top:12px"><strong>Tonnage : ${fmtQty(unit.tonnage)}</strong> <span class="muted">(calculé à l'enregistrement)</span></div>`,
      'open', !ro, 'Renseignez d\'abord les mesures horaires (poids sec), elles servent au calcul du tonnage.');
      S(true, (el) => {
        const heures = [...el.querySelectorAll('[data-h]')].map((s) => Number(s.value));
        if (heures.some((h) => !h)) throw new Error("Associez chaque heure d'échantillonnage à un produit.");
        return { path: unitUrl('produits'), body: { lignes: rowsOf(el, 'q'), heures }, toast: (r) => r.compteurs_modifies ? '✓ Enregistré — compteurs mis à jour (OT préventifs : à lancer depuis le PC)' : '✓ Enregistré' };
      });
      blocks += block('Mesures horaires', unit.horaire.map((h) => `
          <div style="margin-top:10px"><strong style="font-size:.9rem">${escapeHtml(h.designation)}</strong>
          <div class="hours-grid">${[1, 2, 3, 4, 5, 6, 7, 8].map((k) => `<div><span class="muted">H${k}</span>${pIn(`data-hr="${h.id}" data-f="h${k}"`, h['h' + k], ro)}</div>`).join('')}</div></div>`).join('') || '<div class="empty">Aucune mesure horaire</div>', '', !ro && unit.horaire.length > 0);
      S(unit.horaire.length > 0, (el) => ({ path: unitUrl('horaire'), body: { lignes: [...new Set([...el.querySelectorAll('[data-hr]')].map((i) => i.dataset.hr))].map((id) => ({ id: Number(id), h: [1, 2, 3, 4, 5, 6, 7, 8].map((k) => readNum(el.querySelector(`[data-hr="${id}"][data-f="h${k}"]`))) })) } }));
      blocks += block('Qualité', unit.qualite.map((q) => pRow(q.designation, pIn(`data-v="${q.id}"`, q.valeur, ro))).join('') || '<div class="empty">Aucun champ</div>', '', !ro && unit.qualite.length > 0);
      S(unit.qualite.length > 0, (el) => ({ path: unitUrl('qualite'), body: { lignes: rowsOf(el, 'v') } }));
      blocks += chefBlock(unit, chefs, ro);
      S(true, (el) => {
        const id_cf = Number(el.querySelector('.cf-sel').value);
        if (!id_cf) throw new Error("Choisissez un chef d'équipe.");
        return { path: unitUrl('cf'), body: { id_cf } };
      });
    }

    if (unit && sec === 'four') {
      blocks += block('Entrée du four', unit.entree.map((p) => pRow(p.designation, pIn(`data-q="${p.id}" data-f="quantite"`, p.quantite, ro))).join(''), 'open', !ro, 'Quantités entrées (le tonnage se calcule à l\'enregistrement).');
      S(true, (el) => ({ path: unitUrl('entree'), body: { lignes: rowsOf(el, 'q') } }));
      blocks += block('Sortie du four', unit.sortie.map((p) => pRow(p.designation, pIn(`data-q="${p.id}" data-f="quantite"`, p.quantite, ro))).join(''), '', !ro);
      S(true, (el) => ({ path: unitUrl('sortie'), body: { lignes: rowsOf(el, 'q') } }));
      blocks += block('Mesures du four', unit.champs.map((q) => pRow(q.designation, pIn(`data-v="${q.id}"`, q.valeur, ro))).join('') || '<div class="empty">Aucun champ</div>', '', !ro && unit.champs.length > 0, 'Le poids du four sert au calcul des tonnages d\'entrée et de sortie.');
      S(unit.champs.length > 0, (el) => ({ path: unitUrl('champs'), body: { lignes: rowsOf(el, 'v') } }));
    }

    if (unit && sec === 'preparation') {
      blocks += block('Mesures', unit.qualite.map((q) => pRow(q.designation, pIn(`data-v="${q.id}"`, q.valeur, ro))).join('') || '<div class="empty">Aucun champ</div>', 'open', !ro && unit.qualite.length > 0);
      S(unit.qualite.length > 0, (el) => ({ path: unitUrl('qualite'), body: { lignes: rowsOf(el, 'v') } }));
      blocks += block('Valeurs A / S', unit.as.map((q) => `<div class="line-item"><div class="line-name">${escapeHtml(q.designation)}</div><span class="muted">A</span>${pIn(`data-as="${q.id}" data-f="valeur_a"`, q.valeur_a, ro)}<span class="muted">S</span>${pIn(`data-as="${q.id}" data-f="valeur_s"`, q.valeur_s, ro)}</div>`).join('') || '<div class="empty">Aucun champ</div>', '', !ro && unit.as.length > 0);
      S(unit.as.length > 0, (el) => ({ path: unitUrl('as'), body: { lignes: rowsOf(el, 'as') } }));
    }

    if (unit && sec === 'emballage') {
      blocks += block('Produits emballés', unit.produits.map((p) => `
          <div style="padding:10px 0;border-bottom:1px solid var(--line)"><strong style="font-size:.9rem">${escapeHtml(p.designation)}</strong>
          <div class="hours-grid three">
            <div><span class="muted">Quantité</span>${pIn(`data-q="${p.id}" data-f="quantite"`, p.quantite, ro)}</div>
            <div><span class="muted">Bobines feuillard</span>${pIn(`data-q="${p.id}" data-f="nbr_bobine_feuillard"`, p.nbr_bobine_feuillard, ro)}</div>
            <div><span class="muted">Palettes</span>${pIn(`data-q="${p.id}" data-f="nbr_pallette"`, p.nbr_pallette, ro)}</div>
          </div></div>`).join(''), 'open', !ro);
      S(true, (el) => ({ path: unitUrl('produits'), body: { lignes: rowsOf(el, 'q') } }));
      blocks += chefBlock(unit, chefs, ro);
      S(true, (el) => {
        const id_cf = Number(el.querySelector('.cf-sel').value);
        if (!id_cf) throw new Error("Choisissez un chef d'équipe.");
        return { path: unitUrl('cf'), body: { id_cf } };
      });
    }

    main.innerHTML = head + html + (unit ? blocks : '') + (unit ? anomalyBlock(d, unit) : '');

    // Préparation "général" belongs to the report, not to a unit.
    if (sec === 'preparation' && d.preparation.general.length) {
      const g = block('Général', d.preparation.general.map((q) => pRow(q.designation, pIn(`data-v="${q.id}"`, q.valeur, ro))).join(''), '', !ro);
      main.insertAdjacentHTML('beforeend', g);
      S(true, (el) => ({ path: `${base}/preparation/general`, body: { lignes: rowsOf(el, 'v') } }));
    }

    main.querySelectorAll('#unit-nav button').forEach((b) => {
      b.onclick = () => { P.unit[sec] = Number(b.dataset.u); renderRapports(); };
    });
    wireBlocks(main, saves);
    wireAnomalies(main);
  }

  // ---- Reception tab ---------------------------------------------------
  async function renderReception() {
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="card">
        <h2>Bons de commande en attente</h2>
        <div id="open-commandes"><div class="empty">Chargement…</div></div>
      </div>
    `;
    try {
      const commandes = await api('/reception/commandes/open');
      state.openCommandes = commandes;
      const box = document.getElementById('open-commandes');
      if (commandes.length === 0) {
        box.innerHTML = '<div class="empty">Aucun bon en attente</div>';
        return;
      }
      box.innerHTML = commandes.map((c) => `
        <div class="commande-row article-row" data-id="${c.id}" style="cursor:pointer">
          <div>
            <div class="name">${escapeHtml(c.fournisseur)}</div>
            <div class="code">${c.n_commande ? 'N° ' + escapeHtml(String(c.n_commande)) + ' · ' : ''}${new Date(c.date_commande).toLocaleDateString()}</div>
          </div>
        </div>
        <div class="accordion-detail" id="detail-${c.id}"></div>
      `).join('');
      box.querySelectorAll('.commande-row').forEach((row) => {
        row.onclick = () => toggleCommande(Number(row.dataset.id));
      });
    } catch (e) {
      document.getElementById('open-commandes').innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
    }
  }

  async function toggleCommande(idCommande) {
    const detail = document.getElementById(`detail-${idCommande}`);
    const row = document.querySelector(`.commande-row[data-id="${idCommande}"]`);
    const alreadyOpen = detail.style.maxHeight && detail.style.maxHeight !== '0px';

    // Collapse whatever else is open first - only one order expanded at a time.
    document.querySelectorAll('.accordion-detail').forEach((d) => { d.style.maxHeight = '0px'; });
    document.querySelectorAll('.commande-row').forEach((r) => r.classList.remove('expanded'));

    if (alreadyOpen) return; // tapping an open row just closes it

    row.classList.add('expanded');
    const commande = state.openCommandes.find((c) => c.id === idCommande);
    await loadCommandeLines(idCommande, commande, detail);
    // Measure after content is in place so the slide animates to the right height.
    detail.style.maxHeight = detail.scrollHeight + 'px';
  }

  async function loadCommandeLines(idCommande, commande, detail) {
    state.receptionCommande = idCommande;
    detail.innerHTML = `
      <div style="padding:14px 4px 4px">
        <div id="reception-header-${idCommande}" class="muted" style="margin-bottom:10px"></div>
        <div id="reception-lines-${idCommande}"><div class="empty">Chargement…</div></div>
        <button class="primary" id="submit-reception-${idCommande}">Valider la réception</button>
        <div class="error" id="reception-error-${idCommande}"></div>
        <div class="success" id="reception-success-${idCommande}"></div>
      </div>
    `;
    const headerBox = document.getElementById(`reception-header-${idCommande}`);
    headerBox.innerHTML = commande ? `
      <strong style="color:var(--ink)">${escapeHtml(commande.fournisseur)}</strong><br>
      ${commande.n_commande ? 'Bon N° ' + escapeHtml(String(commande.n_commande)) + ' · ' : ''}
      commandé le ${new Date(commande.date_commande).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}
    ` : '';
    const box = document.getElementById(`reception-lines-${idCommande}`);
    try {
      const lines = await api(`/reception/commandes/${idCommande}/lines`);
      state.receptionLines = lines.map((l) => ({ ...l, qt_saisie: Math.max(0, l.qt_commande - l.qt_recu) }));
      const remainingCount = state.receptionLines.filter((l) => l.qt_commande > l.qt_recu).length;
      headerBox.innerHTML += `<br><span class="muted">${state.receptionLines.length} article(s) au total · ${remainingCount} pas encore reçu(s)</span>`;
      box.innerHTML = state.receptionLines.map((l, i) => `
        <div class="line-item">
          <div class="line-name">${escapeHtml(l.designation)}<br><span class="muted">${escapeHtml(l.code_article || '')} · commandé ${l.qt_commande} · reçu ${l.qt_recu}</span></div>
          <input type="number" min="0" step="0.01" value="${l.qt_saisie}" data-idx="${i}" class="recv-qty" />
        </div>
      `).join('');
      box.querySelectorAll('.recv-qty').forEach((inp) => {
        inp.oninput = () => {
          state.receptionLines[Number(inp.dataset.idx)].qt_saisie = Number(inp.value);
          // Content height changed - keep the slide container sized to fit.
          detail.style.maxHeight = detail.scrollHeight + 'px';
        };
      });
      document.getElementById(`submit-reception-${idCommande}`).onclick = () => submitReception(idCommande, detail);
      // Re-measure now that real content replaced the loading spinner.
      detail.style.maxHeight = detail.scrollHeight + 'px';
    } catch (e) {
      box.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
      detail.style.maxHeight = detail.scrollHeight + 'px';
    }
  }

  async function submitReception(idCommande, detail) {
    const errBox = document.getElementById(`reception-error-${idCommande}`);
    const okBox = document.getElementById(`reception-success-${idCommande}`);
    errBox.textContent = ''; okBox.textContent = '';
    const lines = state.receptionLines
      .filter((l) => l.qt_saisie > 0)
      .map((l) => ({ id_article: l.id_article, id_da: l.id_da, qt_recu: l.qt_saisie, qt_bon_etat: l.qt_saisie, qt_mauvais_etat: 0 }));
    if (lines.length === 0) {
      errBox.textContent = 'Saisissez au moins une quantité reçue.';
      return;
    }
    try {
      await api('/reception', { method: 'POST', body: { id_commande: idCommande, lines } });
      okBox.textContent = 'Réception enregistrée.';
      showToast('✓ Réception validée avec succès');
      renderReception();
    } catch (e) {
      errBox.textContent = e.message;
      detail.style.maxHeight = detail.scrollHeight + 'px';
    }
  }

  // ---- BRM (return) tab -----------------------------------------------
  async function renderBrm(root) {
    const main = root || document.getElementById('main');
    main.innerHTML = `
      <div class="card">
        <h2>Retour magasin (BRM)</h2>
        <p class="muted">Choisissez la sortie (BSM) à partir de laquelle créer ce retour.</p>
        <div id="brm-bsm-list"><div class="empty">Chargement…</div></div>
      </div>
    `;
    loadBrmSourceList();
  }

  async function loadBrmSourceList() {
    const box = document.getElementById('brm-bsm-list');
    try {
      const bsms = await api('/bsm/mine');
      state.brmSourceOptions = bsms;
      if (bsms.length === 0) {
        box.innerHTML = '<div class="empty">Aucune sortie avec du matériel encore retournable.</div>';
        return;
      }
      box.innerHTML = bsms.map((b) => `
        <div class="commande-row article-row" data-id="${b.id}" style="cursor:pointer">
          <div>
            <div class="name">BSM #${b.id} · ${escapeHtml(b.type_stock || '')}${b.n_ot ? ' · OT ' + escapeHtml(b.n_ot) : ''}</div>
            <div class="code">${new Date(b.date_bsm).toLocaleDateString('fr-FR')} · ${b.lines.length} article(s) retournable(s)</div>
          </div>
        </div>
        <div class="accordion-detail" id="brm-detail-${b.id}"></div>
      `).join('');
      box.querySelectorAll('.commande-row').forEach((row) => {
        row.onclick = () => toggleBrmSource(Number(row.dataset.id));
      });
    } catch (e) {
      box.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
    }
  }

  function toggleBrmSource(idBsm) {
    const detail = document.getElementById(`brm-detail-${idBsm}`);
    const row = document.querySelector(`#brm-bsm-list .commande-row[data-id="${idBsm}"]`);
    const alreadyOpen = detail.style.maxHeight && detail.style.maxHeight !== '0px';

    // Only one source expanded at a time, same as the Réception list.
    document.querySelectorAll('#brm-bsm-list .accordion-detail').forEach((d) => { d.style.maxHeight = '0px'; });
    document.querySelectorAll('#brm-bsm-list .commande-row').forEach((r) => r.classList.remove('expanded'));

    if (alreadyOpen) return;

    row.classList.add('expanded');

  async function submitBrm(idBsm, detail) {
    const errBox = document.getElementById(`brm-error-${idBsm}`);
    const okBox = document.getElementById(`brm-success-${idBsm}`);
    errBox.textContent = ''; okBox.textContent = '';
    const type_retour = Number(document.getElementById(`type_retour-${idBsm}`).value);

      .filter((l) => l.qty > 0)

      errBox.textContent = 'Choisissez un motif de retour et au moins un article avec une quantité à retourner.';

  // Registers this device's push token with the backend. No-op outside the
  // native app (Capacitor isn't present in a plain browser) or if the
  // person declines the permission prompt.
  async function registerPushNotifications() {
    if (!window.Capacitor?.isNativePlatform?.()) return;
    const plugin = window.Capacitor.Plugins?.PushNotifications;
    if (!plugin) {
      console.warn('PushNotifications plugin not found on window.Capacitor.Plugins - check vendor/capacitor.js and vendor/push-notifications.js are both loading.');
      return;
    }

    try {
      const perm = await plugin.requestPermissions();
      if (perm.receive !== 'granted') return;

      // Listeners MUST be attached before calling register() - if the
      // native side reports the token before anyone's listening for it
      // (which happens often, it's fast), the event is lost for good.
      plugin.addListener('registration', async (token) => {
        // Don't call the server at every launch: only when the token or the
        // user changed, or once a week (in case the server lost it).
        const stamp = `${state.user.id}:${token.value}`;
        try {
          const prev = JSON.parse(localStorage.getItem('gmao_push_registered') || 'null');
          if (prev && prev.stamp === stamp && Date.now() - prev.at < 7 * 86400000) return;
        } catch (e) {}
        console.log('Push token received, registering with backend…');
        try {
          await api('/notifications/register-token', {
            method: 'POST',
            body: { token: token.value, platform: 'android' }
          });
          try { localStorage.setItem('gmao_push_registered', JSON.stringify({ stamp, at: Date.now() })); } catch (e) {}
          console.log('Push token registered with backend successfully.');
        } catch (e) { console.warn('Failed to register push token:', e.message); }
      });
      plugin.addListener('registrationError', (err) => console.warn('Push registration error:', err));
      plugin.addListener('pushNotificationReceived', (notification) => {
        showToast(notification.title || notification.body || 'Nouvelle notification');
        refreshBellBadge(true);
      });

      await plugin.register();
      console.log('plugin.register() called.');
    } catch (e) {
      console.warn('Push notifications unavailable:', e.message);
    }
  }
